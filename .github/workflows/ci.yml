name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wikicraft
          POSTGRES_PASSWORD: wikicraft
          POSTGRES_DB: wikicraft
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U wikicraft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # ~20 integration-test binaries with full debug info don't fit on a hosted runner
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Real Confluence exports (optional fixtures)
        run: ./research/confluence-import/fetch_fixtures.sh || echo "fixtures unavailable, import tests will skip"
      - name: XWiki's Confluence importer test corpus (LGPL, edge cases)
        run: ./research/confluence-import/fetch_xwiki_corpus.sh
      - run: cargo test --workspace
        env:
          WIKICRAFT_REQUIRE_XWIKI_CORPUS: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wikicraft
          POSTGRES_PASSWORD: wikicraft
          POSTGRES_DB: wikicraft
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U wikicraft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WIKICRAFT_E2E_ADMIN_URL: postgres://wikicraft:wikicraft@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        run: cd web && npm ci && npm run build
      - name: Build server
        run: cargo build --release -p wikicraft
      - name: Browser tests
        run: cd e2e && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wikicraft:ci .
