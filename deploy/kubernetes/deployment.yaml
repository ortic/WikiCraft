apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikicraft
  labels: { app.kubernetes.io/name: wikicraft }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: wikicraft }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wikicraft }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: "/api/metrics"
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: wikicraft }
      containers:
        - name: wikicraft
          image: wikicraft
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8787 }
          envFrom:
            - configMapRef: { name: wikicraft }
            - secretRef: { name: wikicraft }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 60   # migrations run on startup (serialized by an advisory lock)
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
          lifecycle:
            # keep serving while the endpoint is removed from load balancers; SIGTERM then
            # flushes live documents (graceful shutdown)
            preStop:
              exec: { command: ["sleep", "5"] }
          volumeMounts:
            - { name: scratch, mountPath: /data }   # import scratch space only; nothing persistent
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scratch
          emptyDir: { sizeLimit: 20Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
