# WikiCraft on Kubernetes (scaled mode). Usage:
#   cp secret.example.yaml secret.yaml && edit secret.yaml configmap.yaml ingress.yaml
#   kubectl apply -k deploy/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wikicraft
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
images:
  - name: wikicraft
    newName: ghcr.io/ortic/wikicraft
    newTag: latest
