# Copy to secret.yaml (do not commit real values) or create it with your secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: wikicraft
type: Opaque
stringData:
  WIKICRAFT_DATABASE_URL: "postgres://wikicraft:CHANGE-ME@postgres.example.internal:5432/wikicraft?sslmode=require"
  WIKICRAFT_S3_ACCESS_KEY_ID: "CHANGE-ME"
  WIKICRAFT_S3_SECRET_ACCESS_KEY: "CHANGE-ME"
  WIKICRAFT_METRICS_TOKEN: "CHANGE-ME"
  # WIKICRAFT_OIDC_CLIENT_SECRET: "CHANGE-ME"
