        attachment rules
      operationId: get_admin_settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id010
                type: object
                properties:
                  publicLinks: *id003
                  exports: *id003
                  ai: *id003
                  personalSpaces: *id003
                  trashRetentionDays:
                    type: integer
                    minimum: 0
                    maximum: 3650
                    description: days pages stay in the trash before they are deleted for good; 0 = forever
                  viewerList:
                    type: boolean
                    description: editors can see who viewed a page (default off)
                  requireTwoFactor:
                    enum:
                    - 'off'
                    - admins
                    - everyone
                    description: who must set up two-factor authentication before using the wiki
                  attachments:
                    type: object
                    properties:
                      maxFileMb:
                        type: integer
                        description: largest file in MB (0 = the server's WIKICRAFT_MAX_UPLOAD_MB)
                      blockedTypes:
                        description: file extensions that can't be uploaded (list or comma-separated)
                      allowedTypes:
                        description: when not empty, only these extensions
                      spaceQuotaMb:
                        type: integer
                        description: attachment storage per space, all versions (0 = no limit)
                      workspaceQuotaMb:
                        type: integer
                        description: attachment storage of the wiki (0 = no limit)
                  serverMaxUploadMb:
                    type: integer
                    readOnly: true
                  attachmentStorageBytes:
                    type: integer
                    readOnly: true
                  maxFileMb:
                    type: integer
                    readOnly: true
                    description: '/features: the largest file the caller may upload'
        4XX:
          description: Error
          content:
            application/json:
              schema:
