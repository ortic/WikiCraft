[package]
name = "wikicraft-confluence"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
flate2 = "1.1.11"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
wikicraft-doc-model = { version = "0.1.0", path = "../doc-model" }
zip = "9.5.0"

[dev-dependencies]
insta = { version = "1.49.0", features = ["glob"] }
pretty_assertions = "1.4.1"

[lints]
workspace = true
